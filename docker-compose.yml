services:

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: churn-api

    ports:
      - "8000:8000"

    restart: unless-stopped


  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.streamlit

    container_name: churn-dashboard

    ports:
      - "8501:8501"

    environment:
      API_URL: "http://api:8000/predict"

    depends_on:
      - api

    restart: unless-stopped